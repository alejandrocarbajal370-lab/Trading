project:
  name: Trading
  reporting_currency: MXN
  investment_currency: USD

run:
  timezone: America/Mexico_City
  mode: research
  human_approval_required: true

data_health:
  minimum_universe_coverage: 0.98
  maximum_critical_missing: 0
  maximum_point_in_time_violations: 0

investment_universe:
  ruleset_version: universe-v1
  minimum_market_cap: 100000000
  minimum_average_volume: 500000
  minimum_average_dollar_volume: 10000000
  allowed_asset_types: [COMMON_STOCK]
  minimum_listing_age_days: 365
  allowed_exchanges: [NASDAQ, NYSE]
  rebalance_schedule:
    frequency: monthly
    interval: 1
  health:
    minimum_eligible_assets: 1
    minimum_eligible_ratio: 0.25
    maximum_group_concentration: 0.60
    maximum_top_10_market_cap_concentration: 0.80
    maximum_stress_coverage_loss: 0.35

portfolio:
  rebalance_frequency: monthly
  allow_cash: true

execution:
  live_enabled: false
  block_on_unknown_order: true
  block_on_reconciliation_failure: true

name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
      - name: Install locked dependencies
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "systematic-trading-engine"
version = "0.1.0"
description = "Capital-preservation-first systematic equity research and portfolio engine"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pydantic>=2.8",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
phase0-validate = "core.phase0:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "core*",
  "data*",
  "monitoring*",
  "fundamentals*",
  "alpha*",
  "backtesting*",
  "portfolio*",
  "risk*",
  "execution*",
  "accounting*",
  "treasury*",
  "database*",
  "reports*",
  "dashboard*",
]
exclude = ["tests*", "research*", "validation_outputs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
